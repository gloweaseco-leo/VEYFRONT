name: One-time import of source repository assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy two verified assets from the pinned public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/chatgpters6/L2M-Web2.git /tmp/l2m-source
          git -C /tmp/l2m-source checkout --quiet 25ca2ef0454228182f65f8912eb326c85ea551fa
          mkdir -p docs/stage-2r/screenshots public/demo
          cp /tmp/l2m-source/docs/stage-2r/screenshots/en-1440-full.png docs/stage-2r/screenshots/en-1440-full.png
          cp /tmp/l2m-source/public/demo/valve.png public/demo/valve.png
          test "$(git hash-object docs/stage-2r/screenshots/en-1440-full.png)" = "689c062b0af9c257e14d4ba021cf3a1e119fec1f"
          test "$(git hash-object public/demo/valve.png)" = "7b04bd00606d90c2a3dcd9d0c5496c1de598531d"
          rm .github/workflows/one-time-import-large-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage-2r/screenshots/en-1440-full.png public/demo/valve.png .github/workflows/one-time-import-large-assets.yml
          git commit -m "chore: finish exact L2M-Web2 snapshot with large binary assets"
          git push origin HEAD:main
