name: Read-only production Speed Insights diagnostics
on:
  pull_request:
    paths:
      - 'scripts/diagnose-speed-insights.py'
      - '.github/workflows/diagnose-speed-insights.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-production-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python scripts/diagnose-speed-insights.py
      - name: Retain non-PII diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyfront-speed-insights-readonly-diagnostic
          path: qa-evidence/speed-insights-probe/probe.json
          retention-days: 7
          if-no-files-found: warn
