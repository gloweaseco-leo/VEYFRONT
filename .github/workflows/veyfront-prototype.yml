name: VEYFRONT prototype checks
on:
  pull_request:
  push:
    branches: [main, feature/veyfront-intake-security-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:demo
      - run: pnpm check:commercial
      - run: pnpm check:brand
      - run: pnpm check:ops
      - run: pnpm check:seo
      - run: pnpm check:security
      - name: Verify the private VRAE contracts over local mutual TLS
        run: node --test tests/vrae-g1-server.test.mjs tests/vrae-preview-client.test.mjs
      - run: pnpm check:w0w1
      - run: node scripts/check-veyfront-brand.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Install headless browser test driver
        run: python3 -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Verify W0/W1 in real Chrome (EN/ZH, desktop/mobile)
        run: python3 scripts/check-w0-w1-browser.py
      - name: W1-C synthetic sales process rehearsal (no IO)
        run: node scripts/w1-c-sales-rehearsal.mjs
      - name: Upload W1-C synthetic rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-c-synthetic-commercial-rehearsal
          path: qa-evidence/w1-c-synthetic/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload W0/W1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w0-w1-browser-evidence
          path: qa-evidence/w0-w1-browser/
          retention-days: 7
          if-no-files-found: warn
