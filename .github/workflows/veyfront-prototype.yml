name: VEYFRONT prototype checks
on:
  pull_request:
  push:
    branches: [feature/veyfront-brand-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:demo
      - run: node scripts/check-veyfront-brand.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
