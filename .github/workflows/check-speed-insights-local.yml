name: Speed Insights mount verification
on:
  pull_request:
    paths:
      - 'app/layout.tsx'
      - 'scripts/check-speed-insights-local.py'
      - '.github/workflows/check-speed-insights-local.yml'
permissions:
  contents: read
jobs:
  mount-check:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python3 -m pip install --disable-pip-version-check playwright==1.55.0
      - run: python3 scripts/check-speed-insights-local.py
      - name: Upload non-PII evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-insights-local-mount
          path: qa-evidence/speed-insights-local/report.json
          retention-days: 7
          if-no-files-found: warn
